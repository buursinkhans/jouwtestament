[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old jouwtestament pages → their Helder Nalaten equivalents (removed 2026-09-27)
[[redirects]]
  from = "/levenstestament"
  to = "/voor-wie/55-plus"
  status = 301

[[redirects]]
  from = "/kinderen-en-nalatenschap"
  to = "/voor-wie/jonge-kinderen"
  status = 301

[[redirects]]
  from = "/samengesteld-gezin"
  to = "/voor-wie/samengesteld-gezin"
  status = 301

[[redirects]]
  from = "/kosten-van-een-testament"
  to = "/tarieven"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301

# Security and privacy headers (2026-09-29).
# CSP: the page may only send data to our own functions (/api) and to Simple Analytics
# (which receives no personal data). Scripts only from our own site and Simple Analytics.
# 'unsafe-inline' is needed because Astro inlines small scripts; connect-src is what keeps
# data from being sent anywhere else.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://scripts.simpleanalyticscdn.com; connect-src 'self' https://queue.simpleanalyticscdn.com; img-src 'self' data: https://queue.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# API responses (conversations, documents, leads) are never cached or indexed
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
